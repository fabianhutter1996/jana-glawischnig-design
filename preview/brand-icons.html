<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand Icons" subtitle="8 custom brand icons — plain + circle frame variants" viewport="700x300" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fdf9f5; font-family: 'Martel Sans', sans-serif; padding: 20px; }
  .section-label { font-size: 8px; text-transform: uppercase; letter-spacing: 0.15em; color: #867276; margin-bottom: 12px; }
  .icon-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .icon-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .icon-cell img { width: 56px; height: 56px; object-fit: contain; }
  .icon-name { font-size: 7px; text-transform: uppercase; letter-spacing: 0.08em; color: #867276; text-align: center; }
  .icon-plain { background: #fff; border: 1px solid rgba(134,53,77,0.08); border-radius: 10px; padding: 10px; }
  .icon-circle { border-radius: 10px; padding: 4px; background: rgba(134,53,77,0.04); }
</style>
</head>
<body>
  <div class="section-label">Brand Icons — Plain</div>
  <div class="icon-row">
    <div class="icon-cell"><div class="icon-plain"><img src="../assets/icons/JG_Icon1.png" alt="Icon 1"></div><div class="icon-name">Icon 1</div></div>
    <div class="icon-cell"><div class="icon-plain"><img src="../assets/icons/JG_Icon2.png" alt="Icon 2"></div><div class="icon-name">Icon 2</div></div>
    <div class="icon-cell"><div class="icon-plain"><img src="../assets/icons/JG_Icon3.png" alt="Icon 3"></div><div class="icon-name">Icon 3</div></div>
    <div class="icon-cell"><div class="icon-plain"><img src="../assets/icons/JG_Icon4.png" alt="Icon 4"></div><div class="icon-name">Icon 4</div></div>
    <div class="icon-cell"><div class="icon-plain"><img src="../assets/icons/JG_Icon5.png" alt="Icon 5"></div><div class="icon-name">Icon 5</div></div>
    <div class="icon-cell"><div class="icon-plain"><img src="../assets/icons/JG_Icon6.png" alt="Icon 6"></div><div class="icon-name">Icon 6</div></div>
    <div class="icon-cell"><div class="icon-plain"><img src="../assets/icons/JG_Icon7.png" alt="Icon 7"></div><div class="icon-name">Icon 7</div></div>
    <div class="icon-cell"><div class="icon-plain"><img src="../assets/icons/JG_Icon8.png" alt="Icon 8"></div><div class="icon-name">Icon 8</div></div>
  </div>
  <div class="section-label">Brand Icons — With Circle Frame</div>
  <div class="icon-row">
    <div class="icon-cell"><div class="icon-circle"><img src="../assets/icons/JG_Icon1_mitKreis.png" alt="Icon 1 Kreis"></div><div class="icon-name">Icon 1</div></div>
    <div class="icon-cell"><div class="icon-circle"><img src="../assets/icons/JG_Icon2_mitKreis.png" alt="Icon 2 Kreis"></div><div class="icon-name">Icon 2</div></div>
    <div class="icon-cell"><div class="icon-circle"><img src="../assets/icons/JG_Icon3_mitKreis.png" alt="Icon 3 Kreis"></div><div class="icon-name">Icon 3</div></div>
    <div class="icon-cell"><div class="icon-circle"><img src="../assets/icons/JG_Icon4_mitKreis.png" alt="Icon 4 Kreis"></div><div class="icon-name">Icon 4</div></div>
    <div class="icon-cell"><div class="icon-circle"><img src="../assets/icons/JG_Icon5_mitKreis.png" alt="Icon 5 Kreis"></div><div class="icon-name">Icon 5</div></div>
    <div class="icon-cell"><div class="icon-circle"><img src="../assets/icons/JG_Icon6_mitKreis.png" alt="Icon 6 Kreis"></div><div class="icon-name">Icon 6</div></div>
    <div class="icon-cell"><div class="icon-circle"><img src="../assets/icons/JG_Icon7_mitKreis.png" alt="Icon 7 Kreis"></div><div class="icon-name">Icon 7</div></div>
    <div class="icon-cell"><div class="icon-circle"><img src="../assets/icons/JG_Icon8_mitKreis.png" alt="Icon 8 Kreis"></div><div class="icon-name">Icon 8</div></div>
  </div>
</body>
</html>
