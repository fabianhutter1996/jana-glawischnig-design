<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Primary Colors" subtitle="Wild Raspberry · Mellow Apricot · Ash Gray brand palette" viewport="700x160" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fdf9f5; font-family: 'Martel Sans', sans-serif; padding: 20px; }
  .swatches { display: flex; gap: 12px; }
  .swatch { flex: 1; border-radius: 12px; overflow: hidden; }
  .color-block { height: 80px; }
  .info { padding: 10px 12px; }
  .name { font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 300; color: #544246; }
  .hex  { font-size: 11px; font-weight: 300; color: #1c1c19; margin-top: 2px; }
  .role { font-size: 8px; text-transform: uppercase; letter-spacing: 0.1em; color: #867276; margin-top: 2px; }
</style>
</head>
<body>
<div class="swatches">
  <div class="swatch">
    <div class="color-block" style="background:#86354D"></div>
    <div class="info"><div class="name">Wild Raspberry</div><div class="hex">#86354D</div><div class="role">Primary</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#691e36"></div>
    <div class="info"><div class="name">Raspberry Dark</div><div class="hex">#691E36</div><div class="role">Primary (deep)</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#F0BB7D"></div>
    <div class="info"><div class="name">Mellow Apricot</div><div class="hex">#F0BB7D</div><div class="role">Tertiary</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#ffddb8"></div>
    <div class="info"><div class="name">Apricot Light</div><div class="hex">#FFDDB8</div><div class="role">Tertiary Fixed</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#B7C0B8"></div>
    <div class="info"><div class="name">Ash Gray</div><div class="hex">#B7C0B8</div><div class="role">Neutral</div></div>
  </div>
</div>
</body>
</html>
