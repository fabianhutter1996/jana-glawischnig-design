<!DOCTYPE html>
<!-- @dsCard group="Type" name="Body & Label Fonts" subtitle="Poppins Light · Martel Sans · WindSong specimens" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&family=Martel+Sans:wght@300;400&family=WindSong&family=Martel+Sans:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fdf9f5; padding: 24px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
  .col-label { font-family: 'Martel Sans',sans-serif; font-size: 8px; text-transform: uppercase; letter-spacing: 0.15em; color: #867276; margin-bottom: 10px; }
  .big { font-size: 1.6rem; line-height: 1.2; color: #1c1c19; margin-bottom: 6px; }
  .para { font-size: 12px; line-height: 1.6; color: #544246; }
</style>
</head>
<body>
<div class="cols">
  <div>
    <div class="col-label">Poppins Light — Body</div>
    <div class="big" style="font-family:'Poppins',sans-serif;font-weight:300;">Authentizität</div>
    <div class="para" style="font-family:'Poppins',sans-serif;font-weight:300;">Kreativität mit Herz trifft auf strategische Präzision und echten Mehrwert für Ihre Marke.</div>
  </div>
  <div>
    <div class="col-label">Martel Sans — Label</div>
    <div class="big" style="font-family:'Martel Sans',sans-serif;font-weight:300;font-size:1rem;text-transform:uppercase;letter-spacing:0.3em;color:#86354D;margin-top:8px;">EXPERTISE</div>
    <div class="para" style="font-family:'Martel Sans',sans-serif;font-weight:300;font-size:10px;text-transform:uppercase;letter-spacing:0.15em;color:#544246;margin-top:12px;">Termin Vereinbaren · Jetzt anfragen · Bundles</div>
  </div>
  <div>
    <div class="col-label">WindSong — Script Accent</div>
    <div class="big" style="font-family:'WindSong',cursive;font-size:2.2rem;color:#86354D;">Social Media</div>
    <div class="big" style="font-family:'WindSong',cursive;font-size:1.6rem;color:#1c1c1980;">Management</div>
  </div>
</div>
</body>
</html>
