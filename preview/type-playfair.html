<!DOCTYPE html>
<!-- @dsCard group="Type" name="Playfair Display Specimen" subtitle="Headline font — Regular, Bold, Italic weights" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Martel+Sans:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fdf9f5; padding: 24px 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
  .col-label { font-family: 'Martel Sans',sans-serif; font-size: 8px; text-transform: uppercase; letter-spacing: 0.15em; color: #867276; margin-bottom: 10px; }
  .sample { font-family: 'Playfair Display', serif; color: #1c1c19; line-height: 1.1; margin-bottom: 6px; }
  .abc { font-family: 'Playfair Display', serif; font-size: 11px; color: #86767660; margin-top: 8px; letter-spacing: 0.03em; }
</style>
</head>
<body>
<div class="cols">
  <div>
    <div class="col-label">Regular 400</div>
    <div class="sample" style="font-size:2.5rem;font-weight:400;">Jana</div>
    <div class="sample" style="font-size:1.2rem;font-weight:400;">Glawischnig</div>
    <div class="abc">AaBbCcDdEe 0123</div>
  </div>
  <div>
    <div class="col-label">Bold 700</div>
    <div class="sample" style="font-size:2.5rem;font-weight:700;">Jana</div>
    <div class="sample" style="font-size:1.2rem;font-weight:700;">Glawischnig</div>
    <div class="abc" style="font-weight:700;">AaBbCcDdEe 0123</div>
  </div>
  <div>
    <div class="col-label">Italic 400</div>
    <div class="sample" style="font-size:2.5rem;font-weight:400;font-style:italic;color:#86354D;">Jana</div>
    <div class="sample" style="font-size:1.2rem;font-weight:400;font-style:italic;">Glawischnig</div>
    <div class="abc" style="font-style:italic;">AaBbCcDdEe 0123</div>
  </div>
</div>
</body>
</html>
