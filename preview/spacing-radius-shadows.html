<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Border Radius & Shadows" subtitle="Border radius scale + warm raspberry shadow system" viewport="700x310" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fdf9f5; font-family: 'Martel Sans', sans-serif; padding: 20px 24px; }
  .row { display: flex; gap: 16px; margin-bottom: 24px; align-items: flex-end; }
  .section-label { font-size: 8px; text-transform: uppercase; letter-spacing: 0.15em; color: #867276; margin-bottom: 14px; }
  .token { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .swatch { width: 64px; height: 44px; background: #ffffff; border: 1.5px solid rgba(134,53,77,0.15); }
  .name { font-size: 7px; text-transform: uppercase; letter-spacing: 0.08em; color: #867276; text-align: center; }
  .val  { font-size: 8px; color: #86354D; text-align: center; }
  .shadow-row { display: flex; gap: 20px; }
  .shadow-card { width: 130px; height: 56px; background: #fff; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <div class="section-label">Border Radius</div>
  <div class="row">
    <div class="token"><div class="swatch" style="border-radius:4px"></div><div class="name">sm / default</div><div class="val">4px</div></div>
    <div class="token"><div class="swatch" style="border-radius:8px"></div><div class="name">md / lg</div><div class="val">8px</div></div>
    <div class="token"><div class="swatch" style="border-radius:12px"></div><div class="name">lg / xl</div><div class="val">12px</div></div>
    <div class="token"><div class="swatch" style="border-radius:16px"></div><div class="name">xl</div><div class="val">16px</div></div>
    <div class="token"><div class="swatch" style="border-radius:24px"></div><div class="name">2xl — Cards</div><div class="val">24px</div></div>
    <div class="token"><div class="swatch" style="border-radius:9999px"></div><div class="name">full — Buttons</div><div class="val">9999px</div></div>
  </div>
  <div class="section-label">Shadows</div>
  <div class="shadow-row">
    <div class="token">
      <div class="shadow-card" style="box-shadow:0 2px 8px rgba(134,53,77,0.04)"></div>
      <div class="name">Subtle</div><div class="val">0 2px 8px · 4%</div>
    </div>
    <div class="token">
      <div class="shadow-card" style="box-shadow:0 10px 40px -10px rgba(134,53,77,0.08)"></div>
      <div class="name">Card</div><div class="val">0 10px 40px · 8%</div>
    </div>
    <div class="token">
      <div class="shadow-card" style="box-shadow:0px 12px 32px rgba(134,53,77,0.06)"></div>
      <div class="name">Editorial</div><div class="val">0 12px 32px · 6%</div>
    </div>
    <div class="token">
      <div class="shadow-card" style="box-shadow:0 20px 60px -15px rgba(134,53,77,0.12)"></div>
      <div class="name">Elevated</div><div class="val">0 20px 60px · 12%</div>
    </div>
  </div>
</body>
</html>
