<!DOCTYPE html>
<!-- @dsCard group="Components" name="Form Elements" subtitle="Input · textarea · submit on dark · error state" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&family=Martel+Sans:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #31302e; font-family: 'Poppins', sans-serif; padding: 24px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  label { font-family: 'Martel Sans', sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(228,226,222,0.6); display: block; margin-bottom: 6px; font-weight: 300; }
  input, textarea {
    width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(228,226,222,0.2);
    border-radius: 10px; padding: 12px 16px; color: #f4f0ec; font-family: 'Poppins', sans-serif;
    font-size: 12px; font-weight: 300; outline: none;
  }
  input::placeholder, textarea::placeholder { color: rgba(228,226,222,0.3); }
  input:focus, textarea:focus { border-color: rgba(242,189,127,0.6); }
  textarea { resize: none; }
  .field { margin-bottom: 0; }
  .btn-submit { width: 100%; padding: 14px; border-radius: 9999px; background: #fdf9f5; color: #86354D; border: none; font-family: 'Martel Sans', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; cursor: pointer; margin-top: 4px; }
  .error-input { border-color: rgba(186,26,26,0.5) !important; }
  .error-msg { font-size: 10px; color: #ffdad6; margin-top: 4px; font-family: 'Martel Sans', sans-serif; font-weight: 300; letter-spacing: 0.05em; }
</style>
</head>
<body>
  <div class="cols">
    <div>
      <div class="field"><label>Name</label><input type="text" placeholder="Dein Name" value="Andrea Müller"></div>
    </div>
    <div>
      <div class="field"><label>E-Mail</label><input type="email" class="error-input" placeholder="deine@email.com" value="andrea@"><div class="error-msg">Bitte gib eine gültige E-Mail-Adresse ein.</div></div>
    </div>
    <div style="grid-column:span 2">
      <div class="field"><label>Nachricht</label><textarea rows="3" placeholder="Erzähl mir von deiner Marke..."></textarea></div>
    </div>
    <div></div>
    <div><button class="btn-submit">Nachricht senden</button></div>
  </div>
</body>
</html>
