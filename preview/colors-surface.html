<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Surface Scale" subtitle="Cotton White to Charleston Green — background & surface tokens" viewport="700x160" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fdf9f5; font-family: 'Martel Sans', sans-serif; padding: 20px; }
  .swatches { display: flex; gap: 10px; }
  .swatch { flex: 1; }
  .color-block { height: 80px; border-radius: 10px; border: 1px solid rgba(134,53,77,0.08); }
  .info { padding: 8px 2px; }
  .name { font-size: 8px; text-transform: uppercase; letter-spacing: 0.1em; color: #544246; }
  .hex  { font-size: 10px; color: #1c1c19; margin-top: 2px; }
</style>
</head>
<body>
<div class="swatches">
  <div class="swatch"><div class="color-block" style="background:#ffffff"></div><div class="info"><div class="name">Lowest</div><div class="hex">#FFFFFF</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#f7f3ef"></div><div class="info"><div class="name">Low</div><div class="hex">#F7F3EF</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#fdf9f5"></div><div class="info"><div class="name">Surface</div><div class="hex">#FDF9F5</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#FFFBF7"></div><div class="info"><div class="name">Cotton White</div><div class="hex">#FFFBF7</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#ebe7e4"></div><div class="info"><div class="name">High</div><div class="hex">#EBE7E4</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#ddd9d6"></div><div class="info"><div class="name">Dim</div><div class="hex">#DDD9D6</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#31302e"></div><div class="info"><div class="name">Inverse</div><div class="hex">#31302E</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#25272A"></div><div class="info"><div class="name">Charleston</div><div class="hex">#25272A</div></div></div>
</div>
</body>
</html>
