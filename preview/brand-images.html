<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand Profile Images" subtitle="Hero portrait + profile images — round · blob · card crop treatments" viewport="700x360" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@300&family=WindSong&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fdf9f5; font-family: 'Martel Sans', sans-serif; padding: 20px; }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  .img-wrap { position: relative; }
  .img-round { width: 120px; height: 120px; border-radius: 9999px; object-fit: cover; border: 3px solid rgba(134,53,77,0.15); }
  .img-blob { width: 160px; height: 200px; object-fit: cover; object-position: top; border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
  .img-card { width: 160px; height: 200px; object-fit: cover; object-position: top; border-radius: 24px; box-shadow: 0 10px 40px -10px rgba(134,53,77,0.12); }
  .label { font-size: 8px; text-transform: uppercase; letter-spacing: 0.1em; color: #867276; margin-top: 8px; text-align: center; }
  .script { font-family: 'WindSong', cursive; font-size: 1.4rem; color: #86354D; margin-left: 20px; align-self: center; }
</style>
</head>
<body>
  <div class="row" style="margin-bottom:16px;">
    <div class="img-wrap" style="flex:1">
      <img src="../assets/images/hero.webp" alt="Hero" style="width:100%;height:220px;object-fit:cover;object-position:top;border-radius:24px;box-shadow:0 10px 40px -10px rgba(134,53,77,0.12);">
      <div class="label">Hero portrait — card crop</div>
    </div>
    <div class="img-wrap" style="width:160px">
      <img src="../assets/images/hero.webp" alt="Hero blob" class="img-blob" style="object-position:top;">
      <div class="label">Organic blob crop</div>
    </div>
    <div class="img-wrap">
      <img src="../assets/images/hero.webp" alt="Hero round" class="img-round" style="object-position:top;">
      <div class="label">Round / avatar</div>
    </div>
  </div>
  <div class="row">
    <div class="img-wrap">
      <img class="img-round" src="../assets/images/JG_SocialMediaProfilbild_1.jpg" alt="Profile 1">
      <div class="label">Profilbild 1 — Round</div>
    </div>
    <div class="img-wrap">
      <img class="img-blob" src="../assets/images/JG_SocialMediaProfilbild_1.jpg" alt="Profile blob">
      <div class="label">Organic blob crop</div>
    </div>
    <div class="img-wrap">
      <img class="img-card" src="../assets/images/JG_SocialMediaProfilbild_2.jpg" alt="Profile 2">
      <div class="label">Profilbild 2 — Card crop</div>
    </div>
    <div class="script">Jana Glawischnig</div>
  </div>
</body>
</html>
