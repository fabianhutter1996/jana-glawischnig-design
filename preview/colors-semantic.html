<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic Colors" subtitle="Error · outline · on-surface text tokens" viewport="700x130" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fdf9f5; font-family: 'Martel Sans', sans-serif; padding: 20px; }
  .swatches { display: flex; gap: 12px; }
  .swatch { flex: 1; }
  .color-block { height: 64px; border-radius: 10px; }
  .info { padding: 8px 2px; }
  .name { font-size: 8px; text-transform: uppercase; letter-spacing: 0.1em; color: #544246; }
  .hex  { font-size: 10px; color: #1c1c19; margin-top: 2px; }
</style>
</head>
<body>
<div class="swatches">
  <div class="swatch"><div class="color-block" style="background:#1c1c19"></div><div class="info"><div class="name">On Surface</div><div class="hex">#1C1C19</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#544246"></div><div class="info"><div class="name">On Surface Var.</div><div class="hex">#544246</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#867276"></div><div class="info"><div class="name">Outline</div><div class="hex">#867276</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#d9c1c4"></div><div class="info"><div class="name">Outline Variant</div><div class="hex">#D9C1C4</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#ba1a1a"></div><div class="info"><div class="name">Error</div><div class="hex">#BA1A1A</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#ffdad6"></div><div class="info"><div class="name">Error Container</div><div class="hex">#FFDAD6</div></div></div>
  <div class="swatch"><div class="color-block" style="background:#3d6b47"></div><div class="info"><div class="name">Success</div><div class="hex">#3D6B47</div></div></div>
</div>
</body>
</html>
