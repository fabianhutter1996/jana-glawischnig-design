<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Color Tints" subtitle="Opacity steps at 20/40/60/80/100%" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fdf9f5; font-family: 'Martel Sans', sans-serif; padding: 20px; }
  .row { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
  .label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #544246; width: 90px; flex-shrink: 0; }
  .tint { flex: 1; height: 40px; border-radius: 6px; }
  .pct { text-align: center; font-size: 8px; color: #867276; margin-top: 3px; }
</style>
</head>
<body>
  <div class="row">
    <div class="label">Wild Raspberry</div>
    <div><div class="tint" style="background:rgba(134,53,77,0.20)"></div><div class="pct">20%</div></div>
    <div><div class="tint" style="background:rgba(134,53,77,0.40)"></div><div class="pct">40%</div></div>
    <div><div class="tint" style="background:rgba(134,53,77,0.60)"></div><div class="pct">60%</div></div>
    <div><div class="tint" style="background:rgba(134,53,77,0.80)"></div><div class="pct">80%</div></div>
    <div><div class="tint" style="background:#86354D"></div><div class="pct">100%</div></div>
  </div>
  <div class="row">
    <div class="label">Mellow Apricot</div>
    <div><div class="tint" style="background:rgba(240,187,125,0.20)"></div><div class="pct">20%</div></div>
    <div><div class="tint" style="background:rgba(240,187,125,0.40)"></div><div class="pct">40%</div></div>
    <div><div class="tint" style="background:rgba(240,187,125,0.60)"></div><div class="pct">60%</div></div>
    <div><div class="tint" style="background:rgba(240,187,125,0.80)"></div><div class="pct">80%</div></div>
    <div><div class="tint" style="background:#F0BB7D"></div><div class="pct">100%</div></div>
  </div>
  <div class="row">
    <div class="label">Ash Gray</div>
    <div><div class="tint" style="background:rgba(183,192,184,0.20)"></div><div class="pct">20%</div></div>
    <div><div class="tint" style="background:rgba(183,192,184,0.40)"></div><div class="pct">40%</div></div>
    <div><div class="tint" style="background:rgba(183,192,184,0.60)"></div><div class="pct">60%</div></div>
    <div><div class="tint" style="background:rgba(183,192,184,0.80)"></div><div class="pct">80%</div></div>
    <div><div class="tint" style="background:#B7C0B8"></div><div class="pct">100%</div></div>
  </div>
</body>
</html>
